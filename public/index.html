
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SureX Recruitment Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:#fff;font-family:Arial,sans-serif}
header{padding:20px 5%;border-bottom:1px solid #354555;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:23px;font-weight:bold}.brand span{color:#00b8d9}
main{max-width:1400px;margin:auto;padding:25px 5%}
.panel{background:#1d2935;border:1px solid #354555;border-radius:12px;padding:22px;margin:18px 0}
h1{font-size:26px}h2{font-size:19px}
.muted,label{color:#b8c5d1}
label{display:block;font-size:13px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #536474;border-radius:7px;background:#101820;color:white}
button{padding:11px 14px;border:0;border-radius:7px;background:#00b8d9;color:#07141c;font-weight:bold;cursor:pointer;margin:4px 3px 4px 0}
button.secondary{background:#354555;color:white}
button:disabled{opacity:.6}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}
.tablewrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:850px}
td,th{text-align:left;padding:12px;border-bottom:1px solid #354555;font-size:13px}
th{color:#b8c5d1;font-weight:normal}
.message{background:#243744;padding:12px;border-radius:7px;white-space:pre-wrap;overflow-wrap:anywhere}
.error{color:#ff8585}
#loginPanel{max-width:440px;margin:60px auto}
.small{font-size:12px}
@media(max-width:800px){.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:500px){.grid,.toolbar{grid-template-columns:1fr}.full{grid-column:auto}main{padding:16px 4%}.panel{padding:15px}}
</style>
</head>
<body>
<header>
  <div class="brand">SureX <span>Recruitment</span></div>
  <div class="row"><span id="account" class="muted"></span><button id="logout" class="secondary hidden">Sign out</button></div>
</header>
<main>
<section id="loginPanel" class="panel">
  <h1>Welcome back</h1>
  <p class="muted">Sign in to the recruitment portal.</p>
  <form id="loginForm">
    <label>Email address</label><input id="email" type="email" required autocomplete="username">
    <label>Password</label><input id="password" type="password" required autocomplete="current-password">
    <button id="loginButton">Sign in</button>
  </form>
  <p id="loginMessage" class="message">Connecting...</p>
</section>

<section id="app" class="hidden">
  <h1>Candidate management</h1>
  <p class="muted">Search, review and update recruitment candidates.</p>

  <section class="panel">
    <div class="row" style="justify-content:space-between">
      <h2>Candidates</h2>
      <div><button id="refresh" class="secondary">Refresh</button><button id="addButton">+ Add candidate</button></div>
    </div>
    <div class="toolbar">
      <div><label>Search name</label><input id="search" placeholder="Candidate name"></div>
      <div><label>Branch</label><select id="branchFilter"><option value="">All branches</option></select></div>
      <div><label>Recruiter</label><select id="recruiterFilter"><option value="">All recruiters</option></select></div>
      <div><label>Status</label><select id="statusFilter"><option value="">All statuses</option></select></div>
    </div>
    <p id="listMessage" class="message">Loading candidates...</p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Name</th><th>Branch</th><th>Recruiter</th><th>Status</th><th>Licence</th><th>Credit</th><th>MIE</th><th>Action</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="count" class="muted small"></p>
  </section>

  <section id="formPanel" class="panel hidden">
    <h2 id="formTitle">Add candidate</h2>
    <p class="muted small">Fields marked * are required.</p>
    <form id="candidateForm" class="grid">
      <div><label>Full name *</label><input id="fullName" required maxlength="200"></div>
      <div><label>Status *</label><input id="status" required maxlength="100" value="New"></div>
      <div><label>Branch *</label><select id="branch" required></select></div>
      <div><label>Recruiter *</label><select id="recruiter" required></select></div>
      <div><label>Licence check *</label><input id="licence" required value="Pending"></div>
      <div><label>Credit check *</label><input id="credit" required value="Pending"></div>
      <div><label>MIE check *</label><input id="mie" required value="Pending"></div>
      <div class="full"><label>Screening notes</label><textarea id="notes" rows="4" maxlength="5000"></textarea></div>
      <div class="full row"><button id="saveButton">Save candidate</button><button id="cancel" type="button" class="secondary">Cancel</button></div>
    </form>
    <p id="formMessage" class="message hidden"></p>
  </section>
</section>
</main>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase=createClient(
  "https://mlovrosbgesesidlqbth.supabase.co",
  "sb_publishable_9as4DXTfGM-axP-EdQVbGQ_B-zdUuxg"
);
const $=id=>document.getElementById(id);
let user=null,role=null,branches=[],recruiters=[],candidates=[],editingId=null;

function msg(id,text,error=false){
  $(id).textContent=text;
  $(id).classList.remove("hidden");
  $(id).classList.toggle("error",error);
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function fillSelect(id,items,first){
  const s=$(id);s.replaceChildren();
  const opt=document.createElement("option");opt.value="";opt.textContent=first;s.append(opt);
  items.forEach(x=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.name;s.append(o);});
}
async function verifyRole(){
  const {data,error}=await supabase.rpc("get_my_role");
  if(error)throw error;
  if(!["admin","assistant"].includes(data))throw Error("No recognised role is assigned to this account.");
  return data;
}
async function loadReferenceData(){
  const [b,r]=await Promise.all([
    supabase.from("branches").select("id,name").order("name"),
    supabase.from("recruiters").select("id,name").order("name")
  ]);
  if(b.error)throw b.error;if(r.error)throw r.error;
  branches=b.data||[];recruiters=r.data||[];
  fillSelect("branchFilter",branches,"All branches");
  fillSelect("recruiterFilter",recruiters,"All recruiters");
  fillSelect("branch",branches,"Choose branch");
  fillSelect("recruiter",recruiters,"Choose recruiter");
}
async function loadCandidates(){
  $("refresh").disabled=true;
  msg("listMessage","Loading candidates...");
  try{
    const {data,error}=await supabase.from("candidates")
      .select("id,full_name,branch_id,recruiter_id,status,licence_check,credit_check,mie_check,screening_notes,deleted_at")
      .is("deleted_at",null).order("created_at",{ascending:false});
    if(error)throw error;
    candidates=data||[];
    const old=$("statusFilter").value;
    const statuses=[...new Set(candidates.map(c=>c.status).filter(Boolean))].sort();
    $("statusFilter").replaceChildren();
    const all=document.createElement("option");all.value="";all.textContent="All statuses";$("statusFilter").append(all);
    statuses.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;$("statusFilter").append(o);});
    $("statusFilter").value=statuses.includes(old)?old:"";
    render();
    msg("listMessage","Candidate data loaded.");
  }catch(e){
    candidates=[];render();msg("listMessage","Could not load candidates: "+e.message,true);
  }finally{$("refresh").disabled=false;}
}
function render(){
  const bn=new Map(branches.map(x=>[x.id,x.name]));
  const rn=new Map(recruiters.map(x=>[x.id,x.name]));
  const search=$("search").value.trim().toLowerCase();
  const b=$("branchFilter").value,r=$("recruiterFilter").value,s=$("statusFilter").value;
  const list=candidates.filter(c=>c.full_name.toLowerCase().includes(search)&&(!b||c.branch_id===b)&&(!r||c.recruiter_id===r)&&(!s||c.status===s));
  $("rows").innerHTML=list.map(c=>`<tr>
    <td>${esc(c.full_name)}</td><td>${esc(bn.get(c.branch_id)||"Unknown")}</td>
    <td>${esc(rn.get(c.recruiter_id)||"Unknown")}</td><td>${esc(c.status)}</td>
    <td>${esc(c.licence_check)}</td><td>${esc(c.credit_check)}</td><td>${esc(c.mie_check)}</td>
    <td><button data-edit="${esc(c.id)}">Edit</button></td></tr>`).join("");
  $("count").textContent=`Showing ${list.length} of ${candidates.length} active candidates.`;
}
function openForm(candidate=null){
  editingId=candidate?.id||null;
  $("candidateForm").reset();
  $("formTitle").textContent=editingId?"Edit candidate":"Add candidate";
  $("saveButton").textContent=editingId?"Save changes":"Save candidate";
  $("status").value=candidate?.status||"New";
  $("licence").value=candidate?.licence_check||"Pending";
  $("credit").value=candidate?.credit_check||"Pending";
  $("mie").value=candidate?.mie_check||"Pending";
  $("fullName").value=candidate?.full_name||"";
  $("branch").value=candidate?.branch_id||"";
  $("recruiter").value=candidate?.recruiter_id||"";
  $("notes").value=candidate?.screening_notes||"";
  $("formMessage").classList.add("hidden");
  $("formPanel").classList.remove("hidden");
  $("formPanel").scrollIntoView({behavior:"smooth"});
}
async function openPortal(){
  const {data,error}=await supabase.auth.getSession();if(error)throw error;
  user=data.session?.user||null;
  $("loginPanel").classList.toggle("hidden",!!user);
  $("app").classList.toggle("hidden",!user);
  $("logout").classList.toggle("hidden",!user);
  if(!user){$("account").textContent="";return;}
  try{
    role=await verifyRole();
    $("account").textContent=user.email+" · "+role;
    await loadReferenceData();await loadCandidates();
  }catch(e){
    $("app").classList.add("hidden");$("loginPanel").classList.remove("hidden");
    msg("loginMessage","Portal access error: "+e.message,true);
  }
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("loginButton").disabled=true;
  msg("loginMessage","Signing in...");
  try{
    const {error}=await supabase.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
    if(error)throw error;await openPortal();
  }catch(e){msg("loginMessage","Sign-in failed: "+e.message,true);}
  finally{$("loginButton").disabled=false;}
});
$("logout").addEventListener("click",async()=>{
  const {error}=await supabase.auth.signOut();
  if(error){alert(error.message);return;}
  $("loginForm").reset();await openPortal();
});
$("addButton").addEventListener("click",()=>openForm());
$("cancel").addEventListener("click",()=>{$("formPanel").classList.add("hidden");editingId=null;});
$("refresh").addEventListener("click",loadCandidates);
["search","branchFilter","recruiterFilter","statusFilter"].forEach(id=>
  $(id).addEventListener(id==="search"?"input":"change",render)
);
$("rows").addEventListener("click",e=>{
  const button=e.target.closest("button[data-edit]");
  if(!button)return;
  const candidate=candidates.find(c=>c.id===button.dataset.edit);
  if(candidate)openForm(candidate);
});
$("candidateForm").addEventListener("submit",async e=>{
  e.preventDefault();$("saveButton").disabled=true;
  msg("formMessage",editingId?"Updating candidate...":"Saving candidate...");
  const record={
    full_name:$("fullName").value.trim(),
    status:$("status").value.trim(),
    branch_id:$("branch").value,
    recruiter_id:$("recruiter").value,
    licence_check:$("licence").value.trim(),
    credit_check:$("credit").value.trim(),
    mie_check:$("mie").value.trim(),
    screening_notes:$("notes").value.trim()||null
  };
  try{
    let result;
    if(editingId){
      result=await supabase.from("candidates").update(record).eq("id",editingId).select("id");
    }else{
      result=await supabase.from("candidates").insert({...record,created_by:user.id}).select("id");
    }
    if(result.error)throw result.error;
    if(!result.data?.length)throw Error("No record was updated. Check your permissions and try again.");
    msg("formMessage",editingId?"Candidate updated successfully.":"Candidate saved successfully.");
    $("formPanel").classList.add("hidden");editingId=null;
    await loadCandidates();
  }catch(e){msg("formMessage","Save failed: "+e.message,true);}
  finally{$("saveButton").disabled=false;}
});
supabase.auth.onAuthStateChange(()=>setTimeout(()=>openPortal(),0));
openPortal().catch(e=>msg("loginMessage","Could not start portal: "+e.message,true));
</script>
</body>
</html>
