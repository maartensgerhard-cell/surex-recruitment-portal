
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SureX Recruitment | Reset Password</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #1d2935;
      border: 1px solid #354555;
      border-radius: 14px;
    }
    h1 { font-size: 25px; margin-top: 0; }
    p { color: #b8c5d1; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #536474;
      border-radius: 7px;
      background: #101820;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: 0;
      border-radius: 7px;
      background: #00b8d9;
      color: #07141c;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Set a new password</h1>
    <p>Choose a new password for your SureX Recruitment account.</p>

    <form id="resetForm" hidden>
      <label for="password">New password</label>
      <input id="password" type="password"
        autocomplete="new-password" minlength="8" required>

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password"
        autocomplete="new-password" minlength="8" required>

      <button id="saveButton" type="submit">Update password</button>
    </form>

    <p id="message">Checking your recovery link...</p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these placeholders with your actual Supabase values.
    // Keep the quotation marks. Never use a secret/service-role key.
    const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
    const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");

    if (
      SUPABASE_URL.includes("PASTE_") ||
      SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")
    ) {
      message.textContent =
        "Setup required: add your Supabase Project URL and Publishable key.";
    } else {
      const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      let recoverySessionReady = false;

      try {
        const { data, error } = await supabase.auth.getSession();

        if (error) throw error;

        if (data.session) {
          recoverySessionReady = true;
        } else {
          const hash = new URLSearchParams(
            window.location.hash.substring(1)
          );

          const accessToken = hash.get("access_token");
          const refreshToken = hash.get("refresh_token");
          const recoveryError = hash.get("error_description");

          if (recoveryError) {
            throw new Error(recoveryError);
          }

          if (accessToken && refreshToken) {
            const result = await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });

            if (result.error) throw result.error;
            recoverySessionReady = true;
          }
        }

        if (recoverySessionReady) {
          form.hidden = false;
          message.textContent =
            "Recovery link accepted. Enter and confirm your new password.";
        } else {
          message.textContent =
            "This recovery link is invalid or expired. Request a new password recovery email.";
        }
      } catch (error) {
        message.textContent =
          "Could not validate the recovery link: " + error.message;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmation =
          document.getElementById("confirmPassword").value;

        if (password !== confirmation) {
          message.textContent = "The passwords do not match.";
          return;
        }

        saveButton.disabled = true;
        message.textContent = "Updating password...";

        try {
          const { error } = await supabase.auth.updateUser({
            password
          });

          if (error) throw error;

          message.textContent =
            "Password updated successfully. You can now return to the login test page and sign in.";
          form.hidden = true;
        } catch (error) {
          message.textContent =
            "Password update failed: " + error.message;
        } finally {
          saveButton.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
